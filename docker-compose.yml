services:
  debgen:
    image: ghcr.io/pgvillage-tools/specbuilder:${SPECBUILDER_VERSION:-latest}
    # scripts in a git checkout belong to the host user, so run as root to be able to overwrite them
    user: root
    # specbuilder always names its output <name>-<package_arch>.spec (rpm arch names);
    # rename those to executable build-<name>-<deb arch>-deb.sh scripts
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /specbuilder
        for spec in /host/generated/*.spec; do
          script="$${spec%.spec}"
          case "$${script}" in
            *-x86_64) script="$${script%-x86_64}-amd64" ;;
            *-aarch64) script="$${script%-aarch64}-arm64" ;;
          esac
          script="$${script%/*}/build-$${script##*/}-deb.sh"
          mv "$${spec}" "$${script}"
          chmod 0755 "$${script}"
          echo "Renamed to $${script}"
        done
    volumes:
      - ./:/host
    environment:
      GITHUB2SPEC_CONFIG: /host/config/github2spec.yaml
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  debbuilder:
    image: docker.io/library/${BASEIMAGE:-ubuntu}:${VERSION:-26.04}
    platform: linux/${ARCH:-arm64}
    # debs in a git checkout belong to the host user, so run as root to be able to overwrite them
    user: root
    entrypoint:
      - /bin/sh
      - -ec
      - |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends ca-certificates curl
        /host/scripts/build_debs.sh
    volumes:
      - ./:/host
    environment:
      OUT_DIR: /host/deb
  aptrepo:
    image: docker.io/library/${BASEIMAGE:-ubuntu}:${VERSION:-26.04}
    platform: linux/${ARCH:-arm64}
    # the repo in a git checkout belongs to the host user, so run as root to be able to overwrite it
    user: root
    entrypoint:
      - /bin/sh
      - -ec
      - |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends apt-utils gnupg >/dev/null
        /host/scripts/build_apt_repo.sh
        /host/scripts/sign_apt_repo.sh
    volumes:
      - ./:/host
    environment:
      - DEB_DIR=/host/deb
      - REPO_DIR=/host/apt
      - CODENAME
      - GPG_PASSPHRASE
      - GPG_KEY_B64
